name: Build Vault

on:
  release:
    types: [created]
  workflow_dispatch:  # Manual trigger for testing

jobs:
  # A tagged release must not ship from a commit whose tests fail. The test
  # workflow runs on pushes and pull requests, but a tag can be pushed without
  # either — so the gate has to live here, in front of the thing that builds
  # the binaries people download.
  test:
    runs-on: ubuntu-latest
    # PyQt6 has no display on a CI runner, so render off-screen.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyQt6's Linux wheels bundle Qt but still link the system graphics
      # libraries; without these, `import PyQt6.QtWidgets` fails with
      # "libEGL.so.1: cannot open shared object file" and the UI tests error at
      # collection, aborting the build before any binary is produced.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Vault.exe
            asset_name: Vault-Windows.exe
          - os: macos-latest
            artifact_name: Vault.app
            asset_name: Vault-macOS.zip
          - os: ubuntu-latest
            artifact_name: Vault
            asset_name: Vault-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux-specific: Install Qt dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libegl1

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Record what went into this build
        run: pip freeze

      - name: Build with PyInstaller
        run: pyinstaller Vault.spec

      # Windows: Upload exe directly
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Windows
          path: dist/Vault.exe

      # macOS: Zip the .app bundle and upload
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r Vault-macOS.zip Vault.app

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Vault-macOS
          path: dist/Vault-macOS.zip

      # Linux: Upload binary
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Linux
          path: dist/Vault

  # Upload artifacts to release (only on release event)
  upload-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: id-token signs the attestation, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Bind each binary's hash to this workflow run and the tagged commit, so a
      # download can be proved to be what CI built rather than something swapped
      # onto the release page afterwards. Verify with:
      #   gh attestation verify Vault.exe --repo primer-systems/Vault
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/Vault-Windows/Vault.exe
            artifacts/Vault-macOS/Vault-macOS.zip
            artifacts/Vault-Linux/Vault

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Vault-Windows/Vault.exe
            artifacts/Vault-macOS/Vault-macOS.zip
            artifacts/Vault-Linux/Vault
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
