name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:

  # The Terminal edition, installed the way a user installs it: `pip install
  # primer-vault`, with no `[desktop]` extra and therefore no Qt on the machine
  # at all. This is the only job that can prove the claim - every other job has
  # PyQt6 installed, so a Qt import that leaked back into the shared tier would
  # pass there and fail on every server.
  #
  # The file selection is computed rather than listed: every test that names
  # neither Qt nor the ui package is a test the Terminal edition must pass. A
  # hand-written list would rot the first time somebody added a test and
  # forgot to add it here.
  terminal-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the Terminal edition only
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-mock pytest-asyncio

      - name: Prove Qt is genuinely absent
        run: |
          if python -c "import PyQt6" 2>/dev/null; then
            echo "PyQt6 is installed; this job proves nothing. Check the"
            echo "[project.optional-dependencies] split in pyproject.toml."
            exit 1
          fi
          echo "PyQt6 is not installed, as expected"

      - name: The terminal edition starts
        run: python -m primer_vault --version

      - name: Run every test that does not need Qt
        run: |
          FILES=$(grep -L -E "PyQt6|qapp|primer_vault\.ui" tests/test_*.py | tr '\n' ' ')
          echo "Running: $FILES"
          python -m pytest $FILES -q

  test:
    # Vault is a desktop application whose primary target is Windows, and the
    # release workflow builds macOS and Linux binaries too. Testing only on
    # Linux left the platform most users are on unverified - path handling,
    # file permissions and process behaviour are exactly where that shows.
    #
    # requirements.lock is resolved for every platform at once, so the same
    # hashed install works on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # PyQt6 has no display on any CI runner, so render off-screen. The tests
    # already default this, but setting it for the whole job covers import time
    # too, before any test body runs.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyQt6's Linux wheels bundle Qt but still link the system graphics
      # libraries. Without these, `import PyQt6.QtWidgets` fails with
      # "libEGL.so.1: cannot open shared object file" and every UI test errors
      # at collection. Windows and macOS runners already have their equivalents.
      - name: Install Qt system libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-cov pytest-mock pytest-asyncio ruff

      # Catches the class of mistake review misses: a name that does not exist,
      # an import left behind by a deletion, an exception raised without its
      # cause. Configured in pyproject.toml, and narrow on purpose.
      #
      # Lint and coverage read the source, not the platform, so one run of each
      # is enough - the matrix exists to run the tests three times, not these.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check src/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
