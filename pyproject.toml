[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "primer-vault"
version = "0.1.0"
description = "Self-custodial execution wallet for AI agents on Robinhood Chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["x402", "payments", "ai", "agents", "ethereum", "web3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "eth-account>=0.11.0",
    "mnemonic>=0.20",
    "eth-keys>=0.5.0",
    "web3>=6.15.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6.0",
]

[project.scripts]
primer-vault = "primer_vault:main"

[tool.hatch.build.targets.wheel]
packages = ["src/primer_vault"]
